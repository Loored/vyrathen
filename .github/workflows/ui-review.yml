name: UI review evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-capture:
    name: Linux Chromium review
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CI: true
      PLAYWRIGHT_BROWSERS_PATH: 0
      EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install locked Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Checkout PR base for comparable before evidence
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .cache/ui-base
      - name: Capture base with the same fixture, browser and measured viewports
        if: github.event_name == 'pull_request'
        env:
          EVIDENCE_PHASE: before
          EVIDENCE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cp tests/e2e/frame-evidence.spec.ts tests/e2e/combat-evidence.spec.ts .cache/ui-base/tests/e2e/
          cd .cache/ui-base
          npm ci
          npx playwright install chromium
          npm run build
          npm run test:ui:ci -- frame-evidence.spec.ts combat-evidence.spec.ts
      - name: Preserve base candidate captures in the review artifact
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p output/playwright
          cp -R .cache/ui-base/output/playwright/characters-before .cache/ui-base/output/playwright/combat-before output/playwright/
      - name: Record candidate evidence metadata
        run: |
          mkdir -p output/playwright
          cat > output/playwright/ci-metadata.json <<EOF
          {
            "commit": "${EVIDENCE_SHA}",
            "browser": "chromium",
            "environment": "ubuntu-22.04",
            "resolutions": ["1366x768", "1440x900", "1920x1080", "320x720"],
            "status": "candidate_pending_owner_approval",
            "visual_baselines": "not_created_or_updated"
          }
          EOF
      - name: Unit and DOM tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Review production preview in Chromium
        run: npm run test:ui:ci
      - name: Assemble candidate comparison gallery
        if: always()
        run: node scripts/ui-evidence-index.mjs
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-evidence-${{ github.event.pull_request.head.sha || github.sha }}-chromium-ubuntu-22.04
          path: output/playwright/
          if-no-files-found: warn
          retention-days: 7
